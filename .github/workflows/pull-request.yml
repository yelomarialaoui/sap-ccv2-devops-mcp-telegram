name: Pull request checks

on:
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  build-test-analyze:
    name: Build, test and analyze (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - sap-ccv2-devops-mcp-server
          - sap-ccv2-devops-mcp-client-telegram
          - sap-ccv2-devops-mcp-client-slack
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Build, unit tests and coverage check
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: mvn -B -f ../pom.xml -pl ${{ matrix.module }} -am verify

      - name: Build, unit tests, coverage check and SonarCloud analysis
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B -f ../pom.xml -pl ${{ matrix.module }} -am verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:5.9.0.7382:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=yelomarialaoui
          -Dsonar.projectKey=yelomarialaoui_${{ matrix.module }}

      - name: Publish JUnit test report
        if: always() && matrix.module == 'sap-ccv2-devops-mcp-server' && github.event.pull_request.head.repo.full_name == github.repository
        uses: dorny/test-reporter@v1
        with:
          name: JUnit (${{ matrix.module }})
          path: ${{ matrix.module }}/target/surefire-reports/TEST-*.xml
          reporter: java-junit
          fail-on-error: false
